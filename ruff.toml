target-version = "py310"
line-length = 100

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".secrets",
    ".vscode",
    ".tox",
    "*.md"
]

[lint]
# Pin the selection explicitly so linting is stable across ruff releases. Newer
# ruff versions broadened the implicit default `select`, which flags pre-existing
# idiomatic code; this restores the intended ruleset (ruff's classic default + C901).
select = ["E4", "E7", "E9", "F", "C901"]
ignore = ["E731"]

[lint.mccabe]
max-complexity = 12